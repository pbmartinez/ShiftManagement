# One command: `docker compose up` (or `docker-compose up`), then open http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ShiftM4nagement!" # local demo only
    volumes:
      - db-data:/var/opt/mssql
    # The api waits until SQL Server really accepts queries, not just until the container started.
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 12
      start_period: 20s

  # API + the built Angular app, same origin.
  api:
    build:
      context: ./src
      dockerfile: Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ShiftManagement;User Id=sa;Password=ShiftM4nagement!;TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
